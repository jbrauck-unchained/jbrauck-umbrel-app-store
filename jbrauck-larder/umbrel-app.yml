manifestVersion: 1
id: jbrauck-larder
name: Larder
tagline: Household budgeting that never leaves your server
icon: https://raw.githubusercontent.com/jbrauck-unchained/jbrauck-umbrel-app-store/master/jbrauck-larder/icon.svg
category: finance
version: "1.0.1"
port: 7373
description: >-
  Larder is a self-hosted household budget tracker.


  Log expenses and income against categories, set monthly caps per category,
  and watch the dashboard for pace against budget, month-over-month trends,
  year-over-year comparisons, spending heatmaps, merchant leaderboards and a
  Sankey view of where the money actually goes.


  Everything lives in a single SQLite file under the app's data directory, so
  your financial history stays on your own hardware and is covered by Umbrel's
  backups.
developer: Joe Brauckmann
website: https://github.com/jbrauck-unchained/jbrauck-umbrel-app-store
repo: https://github.com/jbrauck-unchained/jbrauck-umbrel-app-store
support: https://github.com/jbrauck-unchained/jbrauck-umbrel-app-store/issues
submitter: Joe Brauckmann
submission: https://github.com/jbrauck-unchained/jbrauck-umbrel-app-store
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes the app failing to start: Umbrel creates the app data directory as
  root, so the container now chowns it before dropping to an unprivileged
  user.
